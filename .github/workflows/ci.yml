name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, arena/20864b5a-strimer] # TEMP: CI diagnostic, remove once pull_request is proven
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No `test` script yet; Vitest arrives with the first unit-tested logic.
      # --if-present keeps this job green until then, and runs it afterwards.
      - run: npm test --if-present

  build:
    name: Build and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The build generates Next's typed route/layout props, which tsc needs.
      - name: Build
        run: npm run build
      - name: Type check (tsc --noEmit, strict)
        run: npm run typecheck
